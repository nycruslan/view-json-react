name: Feature request
description: Propose a focused improvement to the read-only inspector
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        view-json-react stays a focused, read-only value inspector. Editing, schema, fetching, and persistence are intentionally out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need rather than only the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the API, accessibility behavior, safety bounds, and large-data impact where applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: The proposal preserves the package's read-only scope.
          required: true
        - label: The proposal does not require a runtime dependency or runtime style injection.
          required: true
        - label: I searched existing issues and documentation for an existing solution.
          required: true
