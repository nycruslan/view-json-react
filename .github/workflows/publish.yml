name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # OIDC for npm Trusted Publishing: no long-lived npm token.
    # The trusted publisher is restricted to staging; a maintainer must review
    # and approve every release with npm 2FA before it becomes public.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup npm 12
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Inspect package
        run: npm pack --dry-run

      - name: Stage package on npm
        run: npm stage publish --access public
