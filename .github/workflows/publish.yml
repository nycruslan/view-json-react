name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # OIDC for npm Trusted Publishing: no long-lived npm token.
    # The trusted publisher is restricted to staging; a maintainer must review
    # and approve every release with npm 2FA before it becomes public.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup npm 12
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          node -e "const version=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v'+version) { throw new Error('Tag must be v'+version) }"

      - name: Validate release
        run: pnpm release:check

      - name: Stage package on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRERELEASE=$(node -e "const v=process.argv[1].split('-')[1]; process.stdout.write(v ? v.split('.')[0] : 'latest')" "$VERSION")
          npm stage publish --access public --tag "$PRERELEASE"
