# Supply-chain protection: refuse package versions published less than 24h
# ago. Enforced by pnpm 12 (default policy); declared explicitly so the
# quarantine window is visible in-repo and survives pnpm default changes.
# The packageManager pin in package.json keeps everyone on pnpm 12.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Babel still requires this mature semver release, whose historical publish
# metadata predates npm's current trust model. Keep the exception exact.
trustPolicyExclude:
  - semver@6.3.1
trustPolicyExcludePrune: true
blockExoticSubdeps: true
trustLockfile: false
strictPeerDependencies: true

# Include pinned Actions in routine update checks. TypeScript 7 remains ignored
# until @typescript-eslint expands its current <6.1 peer range.
update:
  githubActions: true
  ignoreDeps:
    - typescript

# Build-script approval. esbuild needs its postinstall to place the platform
# binary; @parcel/watcher works from prebuilt binaries, so its scripts remain
# denied.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false

# Dev-only advisories with no compatible upstream fix yet. Neither reaches the
# zero-dependency package consumers install. Keep the IDs exact, and delete each
# one when its parent allows the patched major:
#  - GHSA-g3hv-75wg-m249 minimatch >=11.0.1: @typescript-eslint/typescript-estree
#    8.72.1 requires minimatch 10; only linting our own fixed globs reaches it.
#  - GHSA-3g3m-2fjr-6pw4 glob >=14.0.2: Storybook's docgen plugin requires glob 13;
#    it runs locally and in CI on this repo's own files, with no abort signal input.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
